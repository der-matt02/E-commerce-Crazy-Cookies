version: '3.8'

# ─── Desarrollo ───────────────────────────────────────────────────────────────
# Modo rápido (base de datos en Docker, app localmente):
#   docker compose up mysql
#   pnpm dev:backend   (otra terminal)
#   pnpm dev:frontend  (otra terminal)
#
# Modo full-stack en Docker:
#   docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  mysql:
    image: mysql:8.0
    container_name: crazy-cookies-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-crazy_cookies}
      MYSQL_USER: ${DB_USER:-crazy_cookies_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_password}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - crazy-cookies-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_ROOT_PASSWORD:-rootpassword}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: crazy-cookies-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://${DB_USER:-crazy_cookies_user}:${DB_PASSWORD:-secure_password}@mysql:3306/${DB_DATABASE:-crazy_cookies}
      BACKEND_PORT: 3000
      CORS_ORIGIN: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - crazy-cookies-network
    volumes:
      - uploads_data:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    container_name: crazy-cookies-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - '3001:3000'
    depends_on:
      - backend
    networks:
      - crazy-cookies-network

networks:
  crazy-cookies-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
