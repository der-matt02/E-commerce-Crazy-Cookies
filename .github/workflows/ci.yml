name: CI/CD

on:
  push:
    branches: [develop, main, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/der-matt02/e-commerce-crazy-cookies-backend
  FRONTEND_IMAGE: ghcr.io/der-matt02/e-commerce-crazy-cookies-frontend

jobs:
  # ─── SAST + lint ────────────────────────────────────────────────────────────
  lint-backend:
    name: ESLint — Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: pnpm/action-setup@e9540b3eafaf84907c087a645d3258bfaa861427 # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run ESLint (security)
        run: |
          pnpm --filter backend exec eslint "src/**/*.ts" \
            --format json \
            --output-file eslint-backend-report.json \
            --max-warnings=0
      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eslint-backend-report
          path: backend/eslint-backend-report.json

  lint-frontend:
    name: ESLint — Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: pnpm/action-setup@e9540b3eafaf84907c087a645d3258bfaa861427 # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run ESLint (security)
        run: |
          pnpm --filter frontend exec eslint "src/**/*.{ts,tsx}" \
            --format json \
            --output-file eslint-frontend-report.json \
            --max-warnings=0
      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eslint-frontend-report
          path: frontend/eslint-frontend-report.json

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Install Semgrep
        run: pip install semgrep
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/jwt \
            --config p/owasp-top-ten \
            --error \
            --sarif \
            --output semgrep.sarif
      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4.31.0
        with:
          sarif_file: semgrep.sarif
      - name: Upload Semgrep report as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-sast-report
          path: semgrep.sarif

  # ─── Pruebas ────────────────────────────────────────────────────────────────
  test-backend:
    name: Tests — Backend (unit)
    runs-on: ubuntu-latest
    needs: [lint-backend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: pnpm/action-setup@e9540b3eafaf84907c087a645d3258bfaa861427 # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma client
        run: pnpm --filter backend exec prisma generate
      - name: Run tests
        run: pnpm --filter backend test

  test-backend-e2e:
    name: Tests — Backend (e2e)
    runs-on: ubuntu-latest
    needs: [lint-backend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: crazy_cookies_test
          MYSQL_USER: crazy_cookies_user
          MYSQL_PASSWORD: secure_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://crazy_cookies_user:secure_password@localhost:3306/crazy_cookies_test
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: pnpm/action-setup@e9540b3eafaf84907c087a645d3258bfaa861427 # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Prisma client
        run: pnpm --filter backend exec prisma generate
      - name: Run migrations
        run: pnpm --filter backend exec prisma migrate deploy
      - name: Run e2e tests
        run: pnpm --filter backend test:e2e

  test-frontend:
    name: Tests — Frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - uses: pnpm/action-setup@e9540b3eafaf84907c087a645d3258bfaa861427 # v3.0.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run tests
        run: pnpm --filter frontend test run

  # ─── Build, firma de artefactos y publicación ──────────────────────────────
  build-and-push:
    name: Build & Push images (GHCR)
    runs-on: ubuntu-latest
    needs: [semgrep, test-backend, test-backend-e2e, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Compute short SHA tag
        id: tag
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        # NEXT_PUBLIC_API_URL se hornea en build-time: esta imagen es la que
        # despliega el cluster de k8s, cuyo backend queda expuesto en el
        # NodePort 30080 (ver k8s/backend/service.yaml).
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:30080
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── DevSecOps: integridad de artefactos ───────────────────────────────────
  trivy-scan:
    name: Trivy — Vulnerabilidades de imágenes
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Trivy — imagen backend (SARIF)
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.sha_tag }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Trivy — imagen frontend (SARIF)
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.sha_tag }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload SARIF (backend) a GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4.31.0
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload SARIF (frontend) a GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@fb84f6228fd846d3c392887f22b18ce2d9139495 # v4.31.0
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Generar SBOM (backend, formato CycloneDX)
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.sha_tag }}
          format: cyclonedx
          output: sbom-backend.cdx.json

      - name: Upload reportes Trivy + SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-reports
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
            sbom-backend.cdx.json

  # ─── DevSecOps: DAST ────────────────────────────────────────────────────────
  dast-zap:
    name: OWASP ZAP — DAST
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Preparar .env mínimo para docker-compose
        run: |
          cat > .env <<'EOF'
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=crazy_cookies
          DB_USER=crazy_cookies_user
          DB_PASSWORD=secure_password
          DB_ROOT_PASSWORD=rootpassword
          JWT_SECRET=ci-dast-jwt-secret
          JWT_REFRESH_SECRET=ci-dast-refresh-secret
          EOF

      - name: Levantar stack con docker-compose
        run: docker compose up -d --build

      - name: Esperar a que el frontend responda
        run: |
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 || true)
            if [ "$code" = "200" ]; then echo "frontend listo"; exit 0; fi
            sleep 5
          done
          echo "frontend nunca respondió 200" && docker compose logs && exit 1

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@906a3c93ffde4864839d31a93daadcbd2737b4da # v0.12.0
        with:
          target: "http://localhost:3001"
          cmd_options: "-a"
          fail_action: false
          # Solo queremos el reporte como artifact, no que abra un Issue en
          # cada corrida (el token por defecto tampoco tiene permiso para eso).
          allow_issue_writing: false
          # El nombre default del artifact interno de la action ("zap_scan",
          # con guion bajo) es rechazado por la API de artifacts de GitHub.
          artifact_name: zap-scan-internal

      - name: Upload reporte ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-dast-report
          path: |
            report_html.html
            report_md.md

      - name: Detener stack
        if: always()
        run: docker compose down -v

  # ─── CD: GitOps — Argo CD sincroniza al detectar este commit ──────────────
  update-manifests:
    name: Actualizar manifiestos k8s (dispara Argo CD)
    runs-on: ubuntu-latest
    needs: [build-and-push, trivy-scan, dast-zap]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          ref: main

      - name: Instalar kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/

      - name: Fijar el nuevo tag de imagen en los manifiestos
        run: |
          cd k8s/backend && kustomize edit set image ${{ env.BACKEND_IMAGE }}=${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.sha_tag }}
          cd ../frontend && kustomize edit set image ${{ env.FRONTEND_IMAGE }}=${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.sha_tag }}

      - name: Commit y push (Argo CD sincroniza automáticamente desde main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend/kustomization.yaml k8s/frontend/kustomization.yaml
          git diff --cached --quiet && echo "sin cambios de imagen" && exit 0
          git commit -m "chore(cd): desplegar ${{ needs.build-and-push.outputs.sha_tag }} [skip ci]"
          git push origin main
