version: 2.1

# ─────────────────────────────────────────────────────────────────────────────
# Orbs
# ─────────────────────────────────────────────────────────────────────────────
# Requiere las siguientes variables de entorno en CircleCI → Project Settings:
#   SLACK_ACCESS_TOKEN   : OAuth token del Slack App (Bot Token)
#   SLACK_DEFAULT_CHANNEL: ID del canal destino (ej. C0123456789)
# ─────────────────────────────────────────────────────────────────────────────
orbs:
  slack: circleci/slack@4.13.3

# ─────────────────────────────────────────────────────────────────────────────
# Executors
# ─────────────────────────────────────────────────────────────────────────────
executors:

  node-default:
    docker:
      - image: cimg/node:18.20
    working_directory: ~/project
    resource_class: medium

  # Executor con MySQL como servicio — usado exclusivamente en tests e2e.
  # Variables de entorno del contenedor primario expuestas a todos los pasos.
  node-mysql:
    docker:
      - image: cimg/node:18.20
        environment:
          DATABASE_URL: mysql://crazy_cookies_user:secure_password@127.0.0.1:3306/crazy_cookies_test
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-key-not-for-production
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
          BACKEND_PORT: "3000"
          CORS_ORIGIN: http://localhost:3001
      - image: mysql:8.0
        environment:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: crazy_cookies_test
          MYSQL_USER: crazy_cookies_user
          MYSQL_PASSWORD: secure_password
    working_directory: ~/project
    resource_class: medium

# ─────────────────────────────────────────────────────────────────────────────
# Commands reutilizables
# ─────────────────────────────────────────────────────────────────────────────
commands:

  # Instala pnpm y restaura la caché del store para acelerar instalaciones.
  setup-pnpm:
    description: Instalar pnpm y restaurar caché
    steps:
      - run:
          name: Install pnpm
          command: |
            npm install -g pnpm@8
            pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v2-

  save-deps-cache:
    description: Persistir pnpm store en caché
    steps:
      - save_cache:
          key: pnpm-v2-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

  # Adjunta el workspace del job `install` y reinstala pnpm en el contenedor.
  # node_modules llega via workspace; pnpm se necesita para ejecutar scripts.
  restore-workspace:
    description: Adjuntar workspace e instalar pnpm
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Install pnpm (re-install in container)
          command: npm install -g pnpm@8

  # Notificación Slack enriquecida al fallar cualquier job.
  # El bloque se envía solo si el job está en estado FAILED (event: fail).
  notify-on-fail:
    description: Notificar en Slack cuando el job falla
    steps:
      - slack/notify:
          event: fail
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":x:  Job fallido: ${CIRCLE_JOB}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repositorio:*\n${CIRCLE_PROJECT_REPONAME}" },
                    { "type": "mrkdwn", "text": "*Branch:*\n`${CIRCLE_BRANCH}`" },
                    { "type": "mrkdwn", "text": "*Autor:*\n${CIRCLE_USERNAME}" },
                    { "type": "mrkdwn", "text": "*Build:*\n#${CIRCLE_BUILD_NUM}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Ver Build" },
                      "url": "${CIRCLE_BUILD_URL}",
                      "style": "danger"
                    }
                  ]
                }
              ]
            }

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Stage 1 ─────────────────────────────────────────────────────────────────
  # Instala todas las dependencias del monorepo y persiste el resultado como
  # workspace compartido para todos los jobs posteriores.
  install:
    executor: node-default
    steps:
      - checkout
      - setup-pnpm
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save-deps-cache
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  # ── Stage 2: calidad de código (todos en paralelo) ──────────────────────────

  lint-backend:
    executor: node-default
    steps:
      - restore-workspace
      - run:
          name: Lint backend
          command: pnpm --filter backend lint
      - notify-on-fail

  lint-frontend:
    executor: node-default
    steps:
      - restore-workspace
      - run:
          name: Lint frontend
          command: pnpm --filter frontend lint
      - notify-on-fail

  typecheck-backend:
    executor: node-default
    steps:
      - restore-workspace
      - run:
          name: TypeScript check backend
          command: pnpm --filter backend exec tsc --noEmit
      - notify-on-fail

  typecheck-frontend:
    executor: node-default
    steps:
      - restore-workspace
      - run:
          name: TypeScript check frontend
          command: pnpm --filter frontend type-check
      - notify-on-fail

  # ── Stage 3: tests ──────────────────────────────────────────────────────────

  # Tests unitarios del backend divididos en 4 contenedores paralelos.
  # circleci tests split distribuye los archivos por tiempos históricos de
  # ejecución; en el primer run usa distribución por nombre de archivo.
  test-backend-unit:
    executor: node-default
    parallelism: 4
    steps:
      - restore-workspace
      - run:
          name: Generate Prisma client
          command: pnpm --filter backend db:generate
      - run:
          name: Split & run unit tests
          command: |
            cd backend

            SPEC_FILES=$(
              circleci tests glob "src/**/*.spec.ts" \
                | circleci tests split --split-by=timings --timings-type=filename \
                | tr '\n' ' '
            )

            echo "Archivos en este contenedor: ${SPEC_FILES:-<ninguno>}"

            if [ -z "${SPEC_FILES// }" ]; then
              echo "Sin tests asignados a este contenedor, saltando."
              exit 0
            fi

            pnpm exec jest ${SPEC_FILES} \
              --coverage \
              --coverageDirectory=../coverage/unit \
              --forceExit \
              --runInBand
      - store_artifacts:
          path: coverage/unit
          destination: backend-unit-coverage
      - notify-on-fail

  # Tests e2e del backend con MySQL real como servicio.
  # Espera activa hasta que el puerto 3306 esté disponible antes de migrar.
  test-backend-e2e:
    executor: node-mysql
    steps:
      - restore-workspace
      - run:
          name: Wait for MySQL
          command: |
            for i in $(seq 1 30); do
              if (echo > /dev/tcp/127.0.0.1/3306) 2>/dev/null; then
                echo "MySQL listo tras ${i} intentos."
                exit 0
              fi
              echo "Esperando MySQL... ${i}/30"
              sleep 2
            done
            echo "ERROR: MySQL no respondió en 60 s." && exit 1
      - run:
          name: Generate Prisma client
          command: pnpm --filter backend db:generate
      - run:
          name: Apply migrations
          command: pnpm --filter backend db:migrate:deploy
      - run:
          name: Run e2e tests
          command: pnpm --filter backend test:e2e
      - notify-on-fail

  # Tests unitarios del frontend divididos en 2 contenedores.
  # --passWithNoTests permite que el job pase aunque no haya tests todavía.
  test-frontend:
    executor: node-default
    parallelism: 2
    steps:
      - restore-workspace
      - run:
          name: Split & run frontend tests
          command: |
            cd frontend

            TEST_FILES=$(
              circleci tests glob "src/**/*.{test,spec}.{ts,tsx}" \
                | circleci tests split --split-by=timings --timings-type=filename \
                | tr '\n' ' '
            )

            echo "Archivos en este contenedor: ${TEST_FILES:-<ninguno>}"

            pnpm exec vitest run --passWithNoTests ${TEST_FILES}
      - notify-on-fail

  # ── Stage 4: build (paralelos, solo si todos los tests pasan) ───────────────

  build-backend:
    executor: node-default
    steps:
      - restore-workspace
      - run:
          name: Generate Prisma client
          command: pnpm --filter backend db:generate
      - run:
          name: Build backend
          command: pnpm --filter backend build
      - store_artifacts:
          path: backend/dist
          destination: backend-dist
      - notify-on-fail

  build-frontend:
    executor: node-default
    steps:
      - restore-workspace
      - run:
          name: Build frontend
          command: pnpm --filter frontend build
          environment:
            NEXT_PUBLIC_API_URL: http://localhost:3000
            NEXT_PUBLIC_SITE_URL: http://localhost:3001
      - store_artifacts:
          path: frontend/.next
          destination: frontend-next
      - notify-on-fail

  # ── Stage 5: notificación final de éxito ────────────────────────────────────
  # Solo se ejecuta cuando build-backend Y build-frontend completaron
  # exitosamente. Si cualquier job anterior falló, este job no corre —
  # la notificación de fallo ya fue enviada por notify-on-fail en ese job.
  notify-success:
    executor: node-default
    steps:
      - slack/notify:
          event: always
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":white_check_mark:  Pipeline completado: ${CIRCLE_PROJECT_REPONAME}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Branch:*\n`${CIRCLE_BRANCH}`" },
                    { "type": "mrkdwn", "text": "*Commit:*\n<${CIRCLE_BUILD_URL}|${CIRCLE_SHA1:0:7}>" },
                    { "type": "mrkdwn", "text": "*Autor:*\n${CIRCLE_USERNAME}" },
                    { "type": "mrkdwn", "text": "*Build:*\n#${CIRCLE_BUILD_NUM}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "Ver Pipeline" },
                      "url": "${CIRCLE_BUILD_URL}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }

# ─────────────────────────────────────────────────────────────────────────────
# Workflow principal
#
# Grafo de dependencias:
#
#   install
#     ├── lint-backend  ──────────────────────────────────────────────┐
#     ├── lint-frontend ──────────────────────────────────────────────┤
#     ├── typecheck-backend ──────────────────────────────────────────┤
#     └── typecheck-frontend ─────────────────────────────────────────┤
#                                                                       │
#                        ┌── test-backend-unit (parallelism: 4) ───────┤
#                        ├── test-backend-e2e  (MySQL service)  ───────┤
#                        └── test-frontend     (parallelism: 2) ───────┤
#                                                                       │
#                                         ┌── build-backend ───────────┤
#                                         └── build-frontend ──────────┤
#                                                                       │
#                                                     notify-success ───┘
# ─────────────────────────────────────────────────────────────────────────────
workflows:
  ci:
    jobs:
      # ── Stage 1 ──────────────────────────────────────────────────────────────
      - install

      # ── Stage 2: calidad de código (paralelo) ────────────────────────────────
      - lint-backend:
          requires: [install]
      - lint-frontend:
          requires: [install]
      - typecheck-backend:
          requires: [install]
      - typecheck-frontend:
          requires: [install]

      # ── Stage 3: tests (paralelo, después de calidad) ────────────────────────
      - test-backend-unit:
          requires:
            - lint-backend
            - typecheck-backend
      - test-backend-e2e:
          requires:
            - lint-backend
            - typecheck-backend
      - test-frontend:
          requires:
            - lint-frontend
            - typecheck-frontend

      # ── Stage 4: build (paralelo, solo si todos los tests pasan) ─────────────
      - build-backend:
          requires:
            - test-backend-unit
            - test-backend-e2e
      - build-frontend:
          requires:
            - test-frontend

      # ── Stage 5: notificación de éxito total ─────────────────────────────────
      - notify-success:
          requires:
            - build-backend
            - build-frontend
