# NOTA: En producción real gestionar con Sealed Secrets, External Secrets Operator,
# o Vault. Estos valores son de demo — reemplazar antes de usar en producción.
apiVersion: v1
kind: Secret
metadata:
  name: crazy-cookies-secrets
  namespace: crazy-cookies
  labels:
    app.kubernetes.io/part-of: crazy-cookies
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "rootpassword"
  MYSQL_USER: "crazy_cookies_user"
  MYSQL_PASSWORD: "secure_password"
  MYSQL_DATABASE: "crazy_cookies"
  DATABASE_URL: "mysql://crazy_cookies_user:secure_password@mysql:3306/crazy_cookies"
  JWT_SECRET: "change-me-in-production-super-secret-jwt-key"
  JWT_REFRESH_SECRET: "change-me-in-production-super-secret-refresh-key"
