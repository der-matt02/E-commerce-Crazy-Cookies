apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: crazy-cookies
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: crazy-cookies
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  clusterIP: None  # Headless — acceso directo al pod para StatefulSet
