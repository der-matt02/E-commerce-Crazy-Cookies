# Hook de Argo CD: corre ANTES de cada sync para aplicar migraciones Prisma.
# BeforeHookCreation elimina el Job anterior antes de crear uno nuevo.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: crazy-cookies
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: backend-migrate
    app.kubernetes.io/part-of: crazy-cookies
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: backend-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Esperando a MySQL..."
              until nc -z mysql 3306; do
                echo "MySQL no disponible, reintentando en 3s..."
                sleep 3
              done
              echo "MySQL listo."
      containers:
        - name: migrate
          image: ghcr.io/der-matt02/e-commerce-crazy-cookies-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          command:
            [
              "sh",
              "-c",
              "export PATH=\"/app/node_modules/.bin:/app/backend/node_modules/.bin:$PATH\" && cd /app/backend && prisma migrate deploy",
            ]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crazy-cookies-secrets
                  key: DATABASE_URL
