apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: crazy-cookies
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: crazy-cookies
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: crazy-cookies
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Esperando MySQL..."; sleep 3
              done
      containers:
        - name: backend
          image: ghcr.io/der-matt02/e-commerce-crazy-cookies-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crazy-cookies-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: crazy-cookies-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: crazy-cookies-secrets
                  key: JWT_REFRESH_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            # main.ts hace mkdirSync en este path al arrancar; sin un volumen
            # escribible acá, el usuario no-root del contenedor no puede crear
            # el directorio sobre el filesystem de la imagen (EACCES).
            - name: uploads
              mountPath: /app/backend/uploads
      volumes:
        - name: uploads
          emptyDir: {}
