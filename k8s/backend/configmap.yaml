apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: crazy-cookies
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: crazy-cookies
data:
  NODE_ENV: "production"
  BACKEND_PORT: "3000"
  # Frontend expuesto vía NodePort 30090 (ver k8s/frontend/service.yaml)
  CORS_ORIGIN: "http://localhost:30090"
  RATE_LIMIT_MAX: "100"
