apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: crazy-cookies
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: crazy-cookies
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: crazy-cookies
    spec:
      containers:
        - name: frontend
          # NEXT_PUBLIC_API_URL se hornea en build-time (ver docker/frontend/Dockerfile),
          # no en runtime — esta imagen se construye apuntando al NodePort del backend
          # (http://localhost:30080), así que esta env var aquí es solo informativa.
          image: ghcr.io/der-matt02/e-commerce-crazy-cookies-frontend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
