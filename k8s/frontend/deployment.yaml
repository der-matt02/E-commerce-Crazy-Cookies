apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: crazy-cookies
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: crazy-cookies
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: crazy-cookies
    spec:
      containers:
        - name: frontend
          image: nginx:alpine
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
          ports:
            - containerPort: 80
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://backend:3000"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
